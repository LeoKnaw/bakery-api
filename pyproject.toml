[project]
name = "bakeryapi"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "psycopg2>=2.9.11",
    "psycopg2-binary>=2.9.11",
    "sqlalchemy>=2.0.48",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "streamlit>=1.30.0",
    "requests>=2.31.0",
    "pydeck>=0.9.1",
    "pandas>=2.3.3",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "bcrypt>=4.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = [".venv/tests"]
pythonpath = [".venv"]
